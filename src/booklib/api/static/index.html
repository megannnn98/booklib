<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Локальный каталог библиотеки">
<meta name="theme-color" content="#1c1f25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booklib">
<title>Booklib</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <h1>booklib</h1>
  <nav id="sections"></nav>
  <div id="status"></div>
</aside>
<div id="sidebar-overlay"></div>

<main>
  <header>
    <button id="burger" type="button" title="Разделы">☰</button>
    <input id="search" type="search" placeholder="поиск по названию, автору, имени файла" autocomplete="off">
    <select id="sort">
      <option value="title">по названию</option>
      <option value="added">по дате добавления</option>
      <option value="year">по году</option>
      <option value="size">по размеру</option>
    </select>
    <button id="tagsBtn" type="button" title="Теги">🏷 теги 0</button>
    <button id="settingsBtn" type="button" title="Настройки">⚙</button>
    <button id="tagsAdminBtn" type="button" title="Словарь тегов">✎🏷</button>
    <button id="rescan" type="button">Обновить</button>
  </header>
  <div id="tagbar" hidden></div>
  <div id="counter"></div>
  <div id="grid"></div>
</main>

<dialog id="editor">
  <form id="e-form" method="dialog">
    <h2>Правка карточки</h2>
    <p id="e-key"></p>
    <label>Название<input id="e-title" autocomplete="off"></label>
    <label>Автор<input id="e-author" autocomplete="off"></label>
    <label>Раздел<input id="e-section" list="sections-list" autocomplete="off"></label>
    <datalist id="sections-list"></datalist>
    <div id="e-tags-block">
      <label>Теги</label>
      <div id="e-tags"></div>
      <div id="e-tags-row">
        <input id="e-tag-input" list="tags-list" autocomplete="off" placeholder="добавить тег">
        <button id="e-tag-add" type="button">Добавить</button>
      </div>
      <datalist id="tags-list"></datalist>
    </div>
    <menu>
      <button id="e-cancel" value="cancel">Отмена</button>
      <button id="e-reset" value="reset">Сбросить правки</button>
      <button id="e-save" value="save" class="primary">Сохранить</button>
    </menu>
  </form>
</dialog>

<!-- Без method="dialog": submit формы (в том числе Enter в поле пути) — это
     «Проверить», а не закрытие диалога. Кнопки действий — обычные button'ы
     с явными обработчиками, поэтому returnValue тут не нужен. -->
<dialog id="settings">
  <form id="s-form">
    <h2>Настройки</h2>
    <p id="s-current"></p>
    <label>Путь библиотеки
      <span id="s-row">
        <input id="s-root" autocomplete="off" spellcheck="false">
        <button id="s-check">Проверить</button>
      </span>
    </label>
    <p id="s-preview" hidden></p>
    <p id="s-info"></p>
    <menu>
      <button type="button" id="s-cancel">Отмена</button>
      <button type="button" class="primary" id="s-apply" disabled>Применить</button>
    </menu>
  </form>
</dialog>

<!-- Лист файлов карточки: удалённый клиент нажимает на карточку и получает
     ссылки на скачивание каждого формата. Без method="dialog": кнопка — обычная. -->
<dialog id="files">
  <div id="files-title"></div>
  <div id="files-list"></div>
  <menu>
    <button type="button" id="files-cancel">Закрыть</button>
  </menu>
</dialog>

<dialog id="tagfilter">
  <form id="tf-form">
    <h2>Теги</h2>
    <input id="tf-search" type="search" placeholder="поиск по имени или алиасу" autocomplete="off">
    <div id="tf-list"></div>
    <menu>
      <button type="button" id="tf-clear">Сбросить</button>
      <button type="button" id="tf-close">Закрыть</button>
    </menu>
  </form>
</dialog>

<dialog id="tagsadmin">
  <form id="ta-form">
    <h2>Словарь тегов</h2>
    <input id="ta-search" type="search" placeholder="поиск" autocomplete="off">
    <div id="ta-list"></div>
    <label>Название<input id="ta-name" autocomplete="off"></label>
    <label>Тип
      <select id="ta-kind">
        <option value="topic">topic</option>
        <option value="technology">technology</option>
        <option value="person">person</option>
        <option value="period">period</option>
        <option value="language">language</option>
        <option value="form">form</option>
        <option value="custom">custom</option>
      </select>
    </label>
    <label>Описание<textarea id="ta-description" rows="3"></textarea></label>
    <label>Алиас<input id="ta-alias" autocomplete="off"></label>
    <label>Цель объединения<input id="ta-merge-target" autocomplete="off"></label>
    <div id="ta-actions">
      <button type="button" id="ta-create">Создать</button>
      <button type="button" id="ta-save" class="primary">Сохранить</button>
      <button type="button" id="ta-add-alias">Добавить алиас</button>
      <button type="button" id="ta-remove-alias">Удалить алиас</button>
      <button type="button" id="ta-merge">Объединить</button>
      <button type="button" id="ta-delete">Удалить</button>
      <button type="button" id="ta-close">Закрыть</button>
    </div>
  </form>
</dialog>

<div id="toast" hidden></div>
<button id="installBtn" type="button" hidden>Установить Booklib</button>
<script src="/static/tag_helpers.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
