<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>booklib</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="sidebar">
  <h1>booklib</h1>
  <nav id="sections"></nav>
  <div id="status"></div>
</aside>

<main>
  <header>
    <input id="search" type="search" placeholder="поиск по названию, автору, имени файла" autocomplete="off">
    <select id="sort">
      <option value="title">по названию</option>
      <option value="added">по дате добавления</option>
      <option value="year">по году</option>
      <option value="size">по размеру</option>
    </select>
    <button id="settingsBtn" type="button" title="Настройки">⚙</button>
    <button id="rescan" type="button">Обновить</button>
  </header>
  <div id="counter"></div>
  <div id="grid"></div>
</main>

<dialog id="editor">
  <form method="dialog">
    <h2>Правка карточки</h2>
    <p id="e-key"></p>
    <label>Название<input id="e-title" autocomplete="off"></label>
    <label>Автор<input id="e-author" autocomplete="off"></label>
    <label>Раздел<input id="e-section" list="sections-list" autocomplete="off"></label>
    <datalist id="sections-list"></datalist>
    <menu>
      <button value="cancel">Отмена</button>
      <button value="reset">Сбросить правки</button>
      <button value="save" class="primary">Сохранить</button>
    </menu>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2>Настройки</h2>
    <p id="s-current"></p>
    <label>Путь библиотеки
      <span id="s-row">
        <input id="s-root" autocomplete="off" spellcheck="false">
        <button id="s-check" type="button">Проверить</button>
      </span>
    </label>
    <p id="s-preview" hidden></p>
    <p id="s-info"></p>
    <menu>
      <button value="cancel">Отмена</button>
      <button value="apply" class="primary" id="s-apply" disabled>Применить</button>
    </menu>
  </form>
</dialog>

<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
