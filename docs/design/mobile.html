<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Booklib — мобильный макет 390×844</title>
<!-- Рамка телефона: внутри iframe та же витрина-макет, ширина 390 включает
     мобильные медиа-запросы боевого style.css. -->
<style>
  body { margin: 0; min-height: 100vh; display: flex; gap: 40px; align-items: center; justify-content: center;
    flex-wrap: wrap; padding: 30px; background: #0b0c0f; font: 13px sans-serif; color: #8b93a3; }
  figure { margin: 0; text-align: center; }
  iframe { width: 390px; height: 844px; border: 10px solid #000; border-radius: 44px; background: #14161a;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); }
</style>
</head>
<body>
  <figure><iframe src="desktop.html" title="Сетка"></iframe><figcaption>Сетка, 2 колонки</figcaption></figure>
  <figure><iframe src="desktop.html?view=list&amp;theme=light" title="Список"></iframe><figcaption>Список, светлая тема</figcaption></figure>
</body>
</html>
